<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>董佳凝 · UX/UI 作品集</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f0eb; color: #171717; }
    main { width: min(920px, calc(100% - 40px)); }
    h1 { margin: 0 0 12px; font-size: clamp(38px, 7vw, 76px); line-height: .95; letter-spacing: -.05em; }
    p { margin: 0 0 40px; color: #575757; font-size: 18px; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    a { min-height: 220px; padding: 28px; border: 2px solid #171717; border-radius: 24px; color: inherit; text-decoration: none; background: #fff; display: flex; flex-direction: column; justify-content: space-between; transition: transform .2s, box-shadow .2s; }
    a:hover { transform: translateY(-5px); box-shadow: 8px 8px 0 #171717; }
    strong { font-size: 34px; }
    span { color: #666; }
    b { align-self: flex-end; font-size: 28px; }
    @media (max-width: 640px) { nav { grid-template-columns: 1fr; } a { min-height: 170px; } }
  </style>
</head>
<body>
  <main>
    <h1>董佳凝<br>UX/UI 作品集</h1>
    <p>请选择要查看的作品集版本。</p>
    <nav>
      <a href="./kani1/"><strong>Kani 1</strong><span>kaniportfolio1</span><b>↗</b></a>
      <a href="./kani2/"><strong>Kani 2</strong><span>kanipotfolio2</span><b>↗</b></a>
    </nav>
  </main>
</body>
</html>
